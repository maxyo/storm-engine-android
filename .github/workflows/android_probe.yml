name: Android ARM64 engine
on:
  push:
    branches: [android/arm64-port]
    paths:
      - '.github/workflows/android_probe.yml'
      - 'android/**'
      - 'tools/android/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native regression tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg clang
      - name: Build dependencies and run regressions
        run: bash tools/android/ci_dependencies.sh
      - name: Build and verify native engine
        run: bash tools/android/ci_engine.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storm-native-arm64-${{ github.sha }}
          path: |
            build/android-ci/engine/game/libengine.so
            build/android-ci/engine/runtime/libmimalloc.so
            build/android-ci/prefix/lib/*.so*
          if-no-files-found: error
