name: Android ARM64 integration probe
on:
  push:
    branches: [android/arm64-port]
    paths:
      - '.github/workflows/android_probe.yml'
      - 'android/**'
      - 'tools/android/**'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify probe (not the game engine)
        run: bash tools/android/ci_probe.sh
      - name: Upload APK, checksum, exact commit and testing notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storm-integration-probe-arm64-${{ github.sha }}
          path: build/android-ci/dist/
          if-no-files-found: error
          retention-days: 14
