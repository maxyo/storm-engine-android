name: Read Android install diagnostic evidence
on:
  push:
    branches: [android/arm64-port]
    paths: ['.github/workflows/android_install_report.yml']
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38822511907 --repo maxyo/storm-engine-android -n android-install-diagnosis-5c6d8bd2ce0d175c8defcd99e678d4160ca68530 -D evidence
          cat evidence/current.xml
          echo
          grep -E 'AndroidRuntime|FATAL EXCEPTION|stormengine|GameLauncher|Resources.NotFound|ANR in' evidence/logcat.txt | tail -100
