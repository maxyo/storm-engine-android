name: Android experimental device-testing release
on:
  push:
    branches: [android/arm64-port]
    paths: ['.github/workflows/android_experimental_release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-experimental-9a1c91d808a5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: maxyo/storm-engine-android
      SOURCE_SHA: 9a1c91d808a5b0c8761797b1d50764c1c212edb2
      TAG: android-experimental-9a1c91d808a5
    steps:
      - name: Fetch and verify exact successful artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/38815893935" > run.json
          gh api "repos/$REPO/actions/artifacts/12011425293" > artifact.json
          gh api "repos/$REPO/actions/artifacts/12011425293/zip" > artifact.zip
          echo '61b412c214e4773b762b1f377e2fa81e7c993d887b2f732c34099bf7113c3546  artifact.zip' | sha256sum -c -
          mkdir release-input
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          sha=os.environ['SOURCE_SHA']; run=json.load(open('run.json')); artifact=json.load(open('artifact.json'))
          assert run['conclusion']=='success' and run['head_sha']==sha
          assert artifact['workflow_run']['id']==38815893935 and artifact['workflow_run']['head_sha']==sha
          assert artifact['id']==12011425293 and not artifact['expired']
          d=Path('release-input')
          with zipfile.ZipFile('artifact.zip') as z:
              assert all('/' not in n and '\\' not in n and n not in ('.','..') for n in z.namelist())
              z.extractall(d)
          m=json.loads((d/'build-manifest.json').read_text())
          assert m['commit']==sha and m['kind']=='game-port' and m['game_port_ready'] is False
          assert 'full engine ARM64 linked' in m['verified']
          apk=d/'storm-engine-arm64-debug.apk'; digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert list(d.glob('*.apk'))==[apk]
          assert m['apk_sha256']==digest
          assert (d/'SHA256SUMS').read_text().strip()==digest+'  '+apk.name
          with zipfile.ZipFile(apk) as z:
              libs=[n for n in z.namelist() if n.startswith('lib/')]
              assert 'lib/arm64-v8a/libengine.so' in libs
              assert not any('probe' in n.lower() or 'fmod' in n.lower() for n in libs)
          notes=f'''# Experimental Android device-testing build

          Full engine build for initial device testing. Runtime and gameplay are UNVERIFIED. This is not a playable/stable release claim.

          Source commit: `{sha}`
          Successful source CI: https://github.com/{os.environ['REPO']}/actions/runs/38815893935
          Source artifact: 12011425293
          APK SHA256: `{digest}`

          Requirements: ARM64 Android API 24+, Vulkan GPU/driver compatible with the pinned DXVK Native renderer. Manifest Vulkan 1.0 is only the loader baseline. Legally obtained TEHO resources must be supplied locally by the tester; no game assets are included.

          Device installation/startup, Vulkan presentation, audio output, lifecycle recovery, controls and save/load remain unverified. The original game_port_ready=false manifest is preserved. Debug signatures can differ between builds; back up saves before uninstalling.

          See attached TESTING.md for import instructions, device checks and log capture.
          '''
          (d/'RELEASE_NOTES.md').write_text(notes)
          print('Exact artifact, full-engine APK, source commit and checksums verified:',digest)
          PY
      - name: Verify APK signing and alignment
        shell: bash
        run: |
          set -euo pipefail
          buildtools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$buildtools/apksigner" verify --verbose --print-certs release-input/storm-engine-arm64-debug.apk
          "$buildtools/zipalign" -c -P 16 -v 4 release-input/storm-engine-arm64-debug.apk
      - name: Publish experimental prerelease without changing game readiness
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing duplicate or replacement."
            gh release view "$TAG" --repo "$REPO" --json url,isPrerelease,tagName
            exit 0
          fi
          gh release create "$TAG" release-input/storm-engine-arm64-debug.apk release-input/SHA256SUMS release-input/build-manifest.json release-input/TESTING.md \
            --repo "$REPO" --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "Experimental Android device testing — 9a1c91d808a5 (runtime unverified)" \
            --notes-file release-input/RELEASE_NOTES.md
