name: Android published APK install diagnosis
on:
  push:
    branches: [android/arm64-port]
    paths: ['.github/workflows/android_install_test.yml', 'tools/android/emulator_install_test.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test published APK on Android emulator
        run: bash tools/android/emulator_install_test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-install-diagnosis-${{ github.sha }}
          path: |
            build/install-test/*.txt
            build/install-test/*.xml
            build/install-test/*.png
            build/install-test/*.log
