name: Host build and checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Host checks (tests/*/run.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 xvfb ninja-build
      - name: Cache pinned dependency sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/host-ci/sources
            build/host-ci/glm
          key: host-sources-${{ hashFiles('tools/android/engine_sources.py', 'tools/android/ci_dependencies.sh', 'cmake/glm.cmake') }}
      - name: Run host checks
        run: xvfb-run -a python3 tools/ci/run_host_tests.py
  ui:
    name: Host build of the UI runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
      - name: Cache fetched UI dependencies and compiler output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/ui-host/_deps
            ~/.cache/ccache
          key: ui-host-${{ hashFiles('src/libs/ui/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: ui-host-${{ hashFiles('src/libs/ui/CMakeLists.txt') }}-
      - name: Build and test
        run: |
          cmake -S src/libs/ui -B build/ui-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build/ui-host --parallel
          ctest --test-dir build/ui-host --output-on-failure
