name: Host build and checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Host checks (tests/*/run.py)
    runs-on: ubuntu-24.04
    # Warm caches: a few minutes. A bgfx pin change rebuilds shaderc and bgfx once (cold).
    timeout-minutes: 45
    env:
      CCACHE_MAXSIZE: 2G  # the Actions cache holds 10 GB per repository
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install host packages
        run: |
          sudo apt-get update
          # libx11-dev, libgl-dev: bgfx.cmake configures the bgfx runtime (needed by the renderer check,
          # tests/renderer_bgfx, and by the shaderc project that shares it) with X11 and OpenGL on Linux;
          # libegl-dev, libgles-dev: the host renderer runs the GLES 3.0 backend through EGL;
          # libegl-mesa0: Mesa's EGL (llvmpipe) for tests/renderer_bgfx/skinning_check (draws in xvfb).
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 xvfb ninja-build ffmpeg clang-18 libclang-rt-18-dev ccache \
            libx11-dev libgl-dev libegl-dev libgles-dev libegl-mesa0
      - name: Cache pinned dependency sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/host-ci/sources
            build/host-ci/glm
          key: host-sources-${{ hashFiles('tools/android/engine_sources.py', 'tools/android/ci_dependencies.sh', 'cmake/glm.cmake') }}
      # Fetched bgfx/etcpak/glm sources and the host shaderc of the bgfx pin (both built once per pin
      # into ~/.cache/storm-deps) and the Storm ccache (tools/ccache/README.md).
      - name: Cache shared dependencies and compiler output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/storm-deps
            ~/.cache/ccache-storm
          key: host-storm-${{ hashFiles('src/libs/renderer_bgfx/cmake/bgfx_pin.cmake', 'src/libs/renderer_bgfx/patches/*', 'src/libs/renderer_bgfx/host-tools/CMakeLists.txt', 'cmake/glm.cmake') }}-${{ github.sha }}
          restore-keys: host-storm-${{ hashFiles('src/libs/renderer_bgfx/cmake/bgfx_pin.cmake', 'src/libs/renderer_bgfx/patches/*', 'src/libs/renderer_bgfx/host-tools/CMakeLists.txt', 'cmake/glm.cmake') }}-
      - name: Cache the FFmpeg build (tools/ffmpeg/build.py)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/host-ci/ffmpeg-cache
          key: host-ffmpeg-${{ hashFiles('tools/ffmpeg/build.py', 'tools/android/engine_sources.py') }}
      - name: Run host checks
        # Clang, like the NDK that builds the shipped engine.
        env:
          CXX: clang++-18
          STORM_ALLOW_COLD_BUILD: CI runner, the restored cache may predate this commit
        run: xvfb-run -a python3 tools/ci/run_host_tests.py
  ui:
    name: Host build of the UI runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install host packages
        run: |
          sudo apt-get update
          # libx11-dev, libgl-dev: the UI decodes .tx textures with bimg from the renderer's bgfx pin, and
          # bgfx.cmake configures (does not build) the bgfx runtime with X11 and OpenGL on Linux.
          sudo apt-get install -y --no-install-recommends ninja-build ccache libx11-dev libgl-dev
      - name: Cache fetched UI dependencies and compiler output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/storm-deps
            ~/.cache/ccache-storm
          key: ui-host-${{ hashFiles('src/libs/ui/CMakeLists.txt', 'src/libs/renderer_bgfx/cmake/bgfx_pin.cmake') }}-${{ github.sha }}
          restore-keys: ui-host-${{ hashFiles('src/libs/ui/CMakeLists.txt', 'src/libs/renderer_bgfx/cmake/bgfx_pin.cmake') }}-
      - name: Build and test
        run: |
          cmake -S src/libs/ui -B build/ui-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          tools/ccache/warmth begin build/ui-host
          cmake --build build/ui-host --parallel
          STORM_ALLOW_COLD_BUILD="CI runner, the restored cache may predate this commit" tools/ccache/warmth end build/ui-host
          ctest --test-dir build/ui-host --output-on-failure
