name: Host build and checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Host checks (tests/*/run.py)
    runs-on: ubuntu-24.04
    # Warm caches: a few minutes. A bgfx pin change rebuilds shaderc and bgfx once (cold).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install host packages
        run: |
          sudo apt-get update
          # libx11-dev, libgl-dev: bgfx.cmake configures the bgfx runtime (needed by the renderer check,
          # tests/renderer_bgfx, and by the shaderc project that shares it) with X11 and OpenGL on Linux;
          # libegl-dev, libgles-dev: the host renderer runs the GLES 3.0 backend through EGL.
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 xvfb ninja-build ffmpeg clang-18 libclang-rt-18-dev ccache \
            libx11-dev libgl-dev libegl-dev libgles-dev
      - name: Cache pinned dependency sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/host-ci/sources
            build/host-ci/glm
          key: host-sources-${{ hashFiles('tools/android/engine_sources.py', 'tools/android/ci_dependencies.sh', 'cmake/glm.cmake') }}
      # The renderer check (tests/renderer_bgfx) compiles shaders with a host shaderc built once per
      # bgfx pin, like the Android CI, and compiles bgfx and the shim through ccache.
      - name: Cache host shaderc
        id: shaderc
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/bgfx-shaderc
          key: bgfx-shaderc-${{ hashFiles('src/libs/renderer_bgfx/cmake/bgfx_pin.cmake', 'src/libs/renderer_bgfx/host-tools/CMakeLists.txt') }}
      - name: Build host shaderc
        if: steps.shaderc.outputs.cache-hit != 'true'
        run: |
          cmake -S src/libs/renderer_bgfx/host-tools -B build/bgfx-host-tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/bgfx-host-tools
          mkdir -p build/bgfx-shaderc && cp build/bgfx-host-tools/shaderc build/bgfx-shaderc/
      - name: Cache renderer compiler output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ccache
          key: host-ccache-${{ hashFiles('src/libs/renderer_bgfx/cmake/bgfx_pin.cmake', 'src/libs/renderer_bgfx/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: host-ccache-${{ hashFiles('src/libs/renderer_bgfx/cmake/bgfx_pin.cmake', 'src/libs/renderer_bgfx/CMakeLists.txt') }}-
      - name: Run host checks
        # Clang, like the NDK that builds the shipped engine.
        env:
          CXX: clang++-18
          STORM_SHADERC: ${{ github.workspace }}/build/bgfx-shaderc/shaderc
        run: xvfb-run -a python3 tools/ci/run_host_tests.py
  ui:
    name: Host build of the UI runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
      - name: Cache fetched UI dependencies and compiler output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/ui-host/_deps
            ~/.cache/ccache
          key: ui-host-${{ hashFiles('src/libs/ui/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: ui-host-${{ hashFiles('src/libs/ui/CMakeLists.txt') }}-
      - name: Build and test
        run: |
          cmake -S src/libs/ui -B build/ui-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build/ui-host --parallel
          ctest --test-dir build/ui-host --output-on-failure
