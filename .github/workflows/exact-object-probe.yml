name: Exact Git object transport probe
on:
  push:
    branches: ["ci/exact-object-probe-1158-20261018"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact Git metadata with one unreferenced object
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.error
          REPOSITORY = "maxyo/storm-engine-android"
          EXPECTED = '7c65781d9e815d0e6731d63025d364bc02cf7321'
          PAYLOAD = {'message': 'Verify exact Git metadata for approved local release transport', 'tree': '7b753704ab92a05c342ac8df842fc078f916259d', 'parents': ['b114bbb9b3925c217253169e25700af04ecf5016'], 'author': {'name': 'Release transport probe', 'email': 'noreply@localhost', 'date': '2026-10-18T12:00:00+05:00'}, 'committer': {'name': 'Release transport probe', 'email': 'noreply@localhost', 'date': '2026-10-18T12:01:00+05:00'}}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          if os.environ.get("GITHUB_REPOSITORY") != REPOSITORY or os.environ.get("GITHUB_ACTIONS") != "true":
              raise SystemExit("Unexpected workflow repository/context")
          token = os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("Missing ordinary job token")
          request = urllib.request.Request(
              "https://api.github.com/repos/" + REPOSITORY + "/git/commits",
              data=json.dumps(PAYLOAD).encode(), method="POST",
              headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  if response.status != 201:
                      raise SystemExit("Unexpected HTTP status")
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("GitData request rejected: HTTP " + str(error.code))
          if result.get("sha") != EXPECTED:
              raise SystemExit("Exact commit SHA mismatch: " + str(result.get("sha")))
          if result.get("tree", {}).get("sha") != PAYLOAD["tree"] or [p.get("sha") for p in result.get("parents", [])] != PAYLOAD["parents"]:
              raise SystemExit("Commit structure mismatch")
          print("PASS exact offset/date/no-final-LF commit roundtrip: " + EXPECTED)
          print("Only one dangling commit object created; no refs, assets or signing material touched")
          PYTHON
